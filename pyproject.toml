[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citegeist"
version = "0.1.0"
description = "BibTeX-native tooling for bibliography augmentation, citation graphs, and search"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
